# Roda a cada envio, em qualquer branch (o resultado aparece também no pull request). O Render só coloca no ar quando isto passa.
name: testes

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sintaxe
        run: npm run verificar
      - name: Montar
        run: npm run montar
      - name: Testes do servidor e da planta
        run: npm test
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Teste no navegador
        run: npm run e2e
      - name: Fotos do teste no navegador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fotos-e2e
          path: testes/e2e/fotos/
          if-no-files-found: ignore

  imagem:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Montar a imagem Docker
        run: docker build -t casa-planta .
      - name: Subir a imagem e conferir
        run: |
          docker run -d --name casa -p 3000:3000 -e ADMIN_EMAIL=ci@exemplo.com -e ADMIN_SENHA_INICIAL=senha-do-teste-ci-1 -e COOKIE_SEGURO=0 casa-planta
          for i in $(seq 1 30); do curl -fsS localhost:3000/saude && break; sleep 1; done
          curl -fsS localhost:3000/saude
          docker logs casa
